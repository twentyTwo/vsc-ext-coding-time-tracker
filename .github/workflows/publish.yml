name: Publish Extension to Visual Studio Marketplace
on:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/workflows/**'  # Ignore changes to workflow files
  workflow_dispatch:  # Allow manual trigger
jobs:
  verify-changes:
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.check-changes.outputs.should_publish }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for all tags and branches
          
      - name: Get changed files
        id: changed-files
        run: |
          # Handle different trigger scenarios
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # For manual triggers, compare with previous commit
            echo "files=$(git diff --name-only HEAD~1 HEAD | tr '\n' ' ')" >> $GITHUB_OUTPUT
          elif [ -z "${{ github.event.before }}" ] || [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            # For first commit or when before is null, get all files in the commit
            echo "files=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || git ls-files | tr '\n' ' ')" >> $GITHUB_OUTPUT
          else
            # Normal push event
            echo "files=$(git diff --name-only ${{ github.event.before }} ${{ github.event.after }} | tr '\n' ' ')" >> $GITHUB_OUTPUT
          fi
          
      - name: Check version change and file types
        id: check-changes
        run: |
          # Check if package.json version changed with proper fallback
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # For manual triggers, check if version changed in last commit
            VERSION_CHANGED=$(git diff HEAD~1 HEAD package.json | grep -E '^\+\s*"version"' || echo "")
          elif [ -z "${{ github.event.before }}" ] || [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            # For first commit or when before is null, assume version changed
            VERSION_CHANGED="version_changed_first_commit"
          else
            # Normal push event
            VERSION_CHANGED=$(git diff ${{ github.event.before }} ${{ github.event.after }} package.json | grep -E '^\+\s*"version"' || echo "")
          fi
          
          # Get list of changed files
          CHANGED_FILES="${{ steps.changed-files.outputs.files }}"
          
          # Debug output
          echo "🔍 Event: ${{ github.event_name }}"
          echo "📁 Changed files: $CHANGED_FILES"
          echo "📦 Version changed: ${VERSION_CHANGED:-'no'}"
          
          # Check if only documentation files were changed
          DOCS_ONLY=true
          for file in $CHANGED_FILES; do
            if [[ ! $file =~ \.(md|txt|doc|docx)$ ]] && [[ ! $file =~ ^docs/ ]]; then
              DOCS_ONLY=false
              break
            fi
          done
          
          # Initialize should_publish as false
          echo "should_publish=false" >> $GITHUB_OUTPUT
          
          # For manual workflow dispatch, always publish (assuming user knows what they're doing)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "🚀 Manual workflow dispatch - proceeding with publish"
            echo "should_publish=true" >> $GITHUB_OUTPUT
          elif [[ "$DOCS_ONLY" == "true" ]]; then
            echo "ℹ️ Only documentation files were changed"
            echo "should_publish=false" >> $GITHUB_OUTPUT
          elif [[ -z "$VERSION_CHANGED" ]]; then
            echo "❌ Version in package.json was not updated"
            echo "should_publish=false" >> $GITHUB_OUTPUT
          else
            echo "✅ Version changed and non-documentation files modified"
            echo "should_publish=true" >> $GITHUB_OUTPUT
          fi
  publish:
    needs: verify-changes
    if: needs.verify-changes.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    environment: VSC EXT
    permissions:
      contents: write
      actions: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Compile
        run: npm run compile
        
      - name: Install vsce
        run: npm install -g @vscode/vsce
        
      - name: Clean existing VSIX files
        run: rm -f *.vsix
      - name: Package Extension
        run: vsce package
        
      - name: Get Package Info
        id: package
        run: |
          VERSION=$(node -p "require('./package.json').version")
          VSIX_PATH="simple-coding-time-tracker-${VERSION}.vsix"
          if [ ! -f "$VSIX_PATH" ]; then
            echo "Error: Expected VSIX file $VSIX_PATH not found"
            exit 1
          fi
          echo "Package created: $VSIX_PATH"
          echo "vsix_path=$VSIX_PATH" >> $GITHUB_OUTPUT
          echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          
      - name: Validate Package
        run: |
          # Verify the package can be listed
          vsce ls ${{ steps.package.outputs.vsix_path }}
          
          # Check package size (warn if > 10MB)
          SIZE=$(stat -c%s "${{ steps.package.outputs.vsix_path }}" 2>/dev/null || stat -f%z "${{ steps.package.outputs.vsix_path }}")
          SIZE_MB=$((SIZE / 1024 / 1024))
          if [ $SIZE_MB -gt 10 ]; then
            echo "⚠️ Warning: Package size is ${SIZE_MB}MB (consider optimizing)"
          else
            echo "✅ Package size: ${SIZE_MB}MB"
          fi
          
      - name: Upload VSIX as artifact
        uses: actions/upload-artifact@v4
        with:
          name: extension-release-v${{ steps.package.outputs.version }}-${{ steps.package.outputs.date }}
          path: "*.vsix"
          retention-days: 90  # Maximum retention period allowed by GitHub
          
      - name: Check if tag exists
        id: check_tag
        run: |
          if git rev-parse "v${{ steps.package.outputs.version }}" >/dev/null 2>&1; then
            echo "Tag v${{ steps.package.outputs.version }} already exists"
            echo "tag_exists=true" >> $GITHUB_OUTPUT
          else
            echo "tag_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Publish to VS Code Marketplace
        id: marketplace_publish
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 30
          command: vsce publish -p $VSC_PAT --packagePath ${{ steps.package.outputs.vsix_path }}
        env:
          VSC_PAT: ${{ secrets.VSC_PAT }}

      - name: Generate Release Notes
        id: release_notes
        run: |
          # Get the previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || echo "")
          VERSION="${{ steps.package.outputs.version }}"
          
          if [ -n "$PREV_TAG" ]; then
            # Generate detailed changelog from commits since last tag
            echo "## 🚀 What's New in v${VERSION}"
            echo ""
            
            # Get commit messages with more details
            COMMITS=$(git log ${PREV_TAG}..HEAD --pretty=format:"- **%s** (%h)" --no-merges)
            
            # Categorize changes
            FEATURES=$(echo "$COMMITS" | grep -i "feat\|add\|new" || echo "")
            FIXES=$(echo "$COMMITS" | grep -i "fix\|bug\|resolve" || echo "")
            IMPROVEMENTS=$(echo "$COMMITS" | grep -i "improve\|enhance\|update\|optimize" || echo "")
            DOCS=$(echo "$COMMITS" | grep -i "doc\|readme" || echo "")
            OTHER=$(echo "$COMMITS" | grep -v -i "feat\|add\|new\|fix\|bug\|resolve\|improve\|enhance\|update\|optimize\|doc\|readme" || echo "")
            
            # Create categorized release body
            cat << EOF > release_body.md
          ## 🚀 What's New in v${VERSION}
          
          This release includes several improvements and fixes to enhance your coding time tracking experience.
          
          EOF
          
            # Add features if any
            if [ -n "$FEATURES" ]; then
              echo "### ✨ New Features" >> release_body.md
              echo "$FEATURES" >> release_body.md
              echo "" >> release_body.md
            fi
            
            # Add fixes if any
            if [ -n "$FIXES" ]; then
              echo "### 🐛 Bug Fixes" >> release_body.md
              echo "$FIXES" >> release_body.md
              echo "" >> release_body.md
            fi
            
            # Add improvements if any
            if [ -n "$IMPROVEMENTS" ]; then
              echo "### 🔧 Improvements" >> release_body.md
              echo "$IMPROVEMENTS" >> release_body.md
              echo "" >> release_body.md
            fi
            
            # Add documentation changes if any
            if [ -n "$DOCS" ]; then
              echo "### 📚 Documentation" >> release_body.md
              echo "$DOCS" >> release_body.md
              echo "" >> release_body.md
            fi
            
            # Add other changes if any
            if [ -n "$OTHER" ]; then
              echo "### 🔄 Other Changes" >> release_body.md
              echo "$OTHER" >> release_body.md
              echo "" >> release_body.md
            fi
            
            # Add installation and additional info
            cat << EOF >> release_body.md
          ## 📦 Installation
          
          ### From VS Code Marketplace (Recommended)
          1. Open VS Code
          2. Go to Extensions (Ctrl+Shift+X)
          3. Search for "Simple Coding Time Tracker"
          4. Click Install
          
          ### Manual Installation
          1. Download the \`.vsix\` file below
          2. Open VS Code
          3. Press Ctrl+Shift+P and type "Extensions: Install from VSIX"
          4. Select the downloaded file
          
          ## 🔗 Links
          
          - **Marketplace**: [VS Code Marketplace](https://marketplace.visualstudio.com/items?itemName=noorashuvo.simple-coding-time-tracker)
          - **Repository**: [GitHub](https://github.com/${{ github.repository }})
          - **Issues**: [Report a Bug](https://github.com/${{ github.repository }}/issues/new)
          - **Full Changelog**: [v${PREV_TAG}...v${VERSION}](https://github.com/${{ github.repository }}/compare/${PREV_TAG}...v${VERSION})
          
          ---
          
          **Release Date**: $(date +'%B %d, %Y')  
          **Package Size**: $(stat -c%s "${{ steps.package.outputs.vsix_path }}" 2>/dev/null | awk '{print int($1/1024/1024)" MB"}' || echo "Unknown")
          EOF
          else
            # First release
            cat << EOF > release_body.md
          ## 🎉 Welcome to Simple Coding Time Tracker v${VERSION}!
          
          This is the initial release of Simple Coding Time Tracker - a powerful VS Code extension that helps you monitor and analyze your coding time.
          
          ## ✨ Key Features
          
          - **Automatic Time Tracking**: Seamlessly tracks your coding time in the background
          - **Project & Branch Tracking**: Organizes time data by project and Git branches
          - **Smart Activity Detection**: Automatically pauses during periods of inactivity
          - **Interactive Visualizations**: Charts and graphs showing your coding patterns
          - **Data Export**: Export your time tracking data for further analysis
          
          ## 📦 Installation
          
          ### From VS Code Marketplace (Recommended)
          1. Open VS Code
          2. Go to Extensions (Ctrl+Shift+X)
          3. Search for "Simple Coding Time Tracker"
          4. Click Install
          
          ### Manual Installation
          1. Download the \`.vsix\` file below
          2. Open VS Code
          3. Press Ctrl+Shift+P and type "Extensions: Install from VSIX"
          4. Select the downloaded file
          
          ## 🚀 Getting Started
          
          Once installed, the extension will automatically start tracking your coding time. You can:
          - View current session time in the status bar
          - Access detailed reports via the Command Palette (Ctrl+Shift+P > "Simple Coding Time Tracker")
          - Configure settings in VS Code preferences
          
          ## 🔗 Links
          
          - **Repository**: [GitHub](https://github.com/${{ github.repository }})
          - **Documentation**: [README](https://github.com/${{ github.repository }}#readme)
          - **Issues**: [Report a Bug](https://github.com/${{ github.repository }}/issues/new)
          
          ---
          
          **Release Date**: $(date +'%B %d, %Y')  
          **Package Size**: $(stat -c%s "${{ steps.package.outputs.vsix_path }}" 2>/dev/null | awk '{print int($1/1024/1024)" MB"}' || echo "Unknown")
          EOF
          fi

      - name: Create GitHub Release
        id: create_release
        if: steps.check_tag.outputs.tag_exists == 'false' && steps.marketplace_publish.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.package.outputs.version }}
          name: Release v${{ steps.package.outputs.version }}
          body_path: release_body.md
          files: ${{ steps.package.outputs.vsix_path }}
          draft: false
          prerelease: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Report Success
        if: steps.create_release.outcome == 'success'
        run: |
          echo "🎉 Release v${{ steps.package.outputs.version }} created successfully!"
          echo "📦 VS Code Marketplace: Published"
          echo "🏷️ GitHub Release: https://github.com/${{ github.repository }}/releases/tag/v${{ steps.package.outputs.version }}"

      - name: Handle Failure
        if: failure()
        run: |
          echo "❌ Workflow failed. Please check the logs above."
          if [ "${{ steps.marketplace_publish.outcome }}" = "failure" ]; then
            echo "🚨 Marketplace publishing failed - check your VSCE_PAT token"
          fi
          if [ "${{ steps.check_tag.outputs.tag_exists }}" = "true" ]; then
            echo "⚠️ Tag v${{ steps.package.outputs.version }} already exists"
          fi
          exit 1

      - name: Notify on Success
        if: success()
        run: |
          echo "::notice title=Release Published::Version v${{ steps.package.outputs.version }} has been published to VS Code Marketplace and GitHub Releases"
